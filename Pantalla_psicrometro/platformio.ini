[env:cyd-esp32dev]
platform = espressif32 
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps = 
	bodmer/TFT_eSPI @ ^2.5.31
	lvgl/lvgl @ ^8.3.11        
	adafruit/RTClib @ ^2.1.4   ; 

build_flags =
  -D USER_SETUP_LOADED=1
  -D ILI9341_2_DRIVER=1
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=4 
  -D TFT_BL=21
  -D TOUCH_CS=33
  -D LOAD_GLCD=1
  -D SPI_FREQUENCY=27000000
  -D SPI_TOUCH_FREQUENCY=2500000
  -D LV_CONF_SKIP=1
  -D LV_COLOR_DEPTH=16
  -D LV_COLOR_16_SWAP=1
  -D LV_TICK_CUSTOM=1