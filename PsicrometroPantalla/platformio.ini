[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep

lib_deps = 
  bodmer/TFT_eSPI@^2.5.31
  lvgl/lvgl@^8.3.11
  https://github.com/ddxfish/XPT2046_Bitbang_Arduino_Library.git
  adafruit/RTClib@^2.1.3
  SPI
  Wire

build_flags =
  -D USER_SETUP_LOADED=1
  -D ST7789_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=320
  -D TFT_MISO=12
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=2
  -D TFT_RST=-1
  -D TFT_BL=21
  -D TFT_BACKLIGHT_ON=HIGH
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D LOAD_FONT4=1
  -D SPI_FREQUENCY=27000000
  -D SPI_READ_FREQUENCY=20000000
  -D SPI_TOUCH_FREQUENCY=2500000
  -D LV_CONF_SKIP=1
  -D LV_TICK_CUSTOM=1
  -D LV_COLOR_16_SWAP=1
  -D TFT_RGB_ORDER=TFT_BGR